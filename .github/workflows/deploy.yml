name: Deploy WalterBinger.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build living map beneath approved homepage
        run: pnpm run build

      - name: Block publishing if analytics were omitted
        run: pnpm run verify:analytics

      - name: Upload approved homepage and living map
        uses: actions/upload-pages-artifact@v3
        with:
          path: homepage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
